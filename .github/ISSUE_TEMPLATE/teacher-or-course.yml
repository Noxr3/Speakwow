name: New teacher or course
description: Propose a persona or a curriculum
labels: [content, good first issue]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What are you adding?
      options: [A teacher (persona card), A course (curriculum outline)]
    validations:
      required: true
  - type: textarea
    id: who
    attributes:
      label: Who is it for, and what makes it different?
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Checklist
      options:
        - label: Course content is an outline only (no copied textbook passages or exercises)
        - label: The persona keeps the shared red lines (it can flavour them, not replace them)
