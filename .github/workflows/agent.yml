name: agent

on:
  pull_request:
    paths:
      - 'apps/agent/**'
      - '.github/workflows/agent.yml'
  push:
    branches: [main]
    paths:
      - 'apps/agent/**'
      - '.github/workflows/agent.yml'

jobs:
  ruff-and-pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check

      - name: Pytest (external-dependency tests marked `live` are skipped)
        run: uv run pytest -m "not live" -v
