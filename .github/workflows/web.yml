name: web

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/web.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/web.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @speakwow/web lint

      - name: Build (doubles as typecheck gate)
        run: pnpm --filter @speakwow/web build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          # build-time placeholders; real values live in Vercel env vars
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

      - name: Test (C1 placeholder — vitest lands in C2)
        run: pnpm --filter @speakwow/web test
